name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew
      - run: ./gradlew build jacocoTestReport --no-daemon
      - name: Coverage summary
        if: always()
        shell: python
        run: |
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          report = pathlib.Path('build/reports/jacoco/test/jacocoTestReport.xml')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## JaCoCo coverage\n\n')
              if report.exists():
                  summary.write('| Counter | Covered | Total | Coverage |\n|---|---:|---:|---:|\n')
                  for counter in ET.parse(report).getroot().findall('counter'):
                      covered = int(counter.attrib['covered'])
                      total = covered + int(counter.attrib['missed'])
                      percent = 100 * covered / total if total else 0
                      summary.write(f"| {counter.attrib['type']} | {covered} | {total} | {percent:.2f}% |\n")
              else:
                  summary.write('Report unavailable; inspect the build failure.\n')
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/jacoco/
          if-no-files-found: warn
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build --tag matchforge:local .
      - name: Start and wait for health
        run: docker compose up --detach --no-build --wait --wait-timeout 180 postgres app
      - name: Smoke test REST
        run: |
          curl --fail --silent --show-error --max-time 10 http://localhost:8080/api/v1/markets > markets.json
          python3 - <<'PY'
          import json
          markets = json.load(open('markets.json'))
          assert any(market['symbol'] == 'BTC-USD' for market in markets), markets
          PY
          curl --fail --silent --show-error --max-time 10 -H 'Content-Type: application/json' \
            -d '{"id":"ci-smoke"}' http://localhost:8080/api/v1/accounts
      - name: Capture logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: docker-smoke-logs
          path: compose.log
      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans --timeout 20
